<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Intro</title>
    <style>
        div {border: 1px solid lightskyblue;}
        section {display: flex;} /* this property must go on the row */
        section div {flex: 1;} /* mus be on the colum(s) */
    </style>
</head>
<body>
    
<section> <!-- this is our flexbox row-->
    <div>1</div>
    <div>2</div>
    <div>3</div>
</section>

</body>
</html>
